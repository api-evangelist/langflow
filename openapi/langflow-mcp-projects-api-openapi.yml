openapi: 3.1.0
info:
  title: Langflow Base mcp_projects API
  version: 1.9.0
tags:
- name: mcp_projects
paths:
  /api/v1/mcp/project/{project_id}:
    get:
      description: List project MCP tools.
      operationId: list_project_tools_api_v1_mcp_project__project_id__get
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          format: uuid
          title: Project Id
          type: string
      - in: query
        name: mcp_enabled
        required: false
        schema:
          default: true
          title: Mcp Enabled
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearerCookie: []
      - API key query: []
      - API key header: []
      summary: List Project Tools
      tags:
      - mcp_projects
    patch:
      description: Update the MCP settings of all flows in a project and project-level auth settings.<br><br>On MCP Composer failure, this endpoint should return with a 200 status code and an error message in<br>the body of the response to display to the user.
      operationId: update_project_mcp_settings_api_v1_mcp_project__project_id__patch
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          format: uuid
          title: Project Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPProjectUpdateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearerCookie: []
      - API key query: []
      - API key header: []
      summary: Update Project Mcp Settings
      tags:
      - mcp_projects
  /api/v1/mcp/project/{project_id}/composer-url:
    get:
      description: Get the MCP Composer URL for a specific project.<br><br>On failure, this endpoint should return with a 200 status code and an error message in<br>the body of the response to display to the user.
      operationId: get_project_composer_url_api_v1_mcp_project__project_id__composer_url_get
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          format: uuid
          title: Project Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposerUrlResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearerCookie: []
      - API key query: []
      - API key header: []
      summary: Get Project Composer Url
      tags:
      - mcp_projects
  /api/v1/mcp/project/{project_id}/install:
    post:
      description: Install MCP server configuration for Cursor, Windsurf, or Claude.
      operationId: install_mcp_config_api_v1_mcp_project__project_id__install_post
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          format: uuid
          title: Project Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPInstallRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearerCookie: []
      - API key query: []
      - API key header: []
      summary: Install Mcp Config
      tags:
      - mcp_projects
  /api/v1/mcp/project/{project_id}/installed:
    get:
      description: Check if MCP server configuration is installed for this project in Cursor, Windsurf, or Claude.
      operationId: check_installed_mcp_servers_api_v1_mcp_project__project_id__installed_get
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          format: uuid
          title: Project Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearerCookie: []
      - API key query: []
      - API key header: []
      summary: Check Installed Mcp Servers
      tags:
      - mcp_projects
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    MCPSettings:
      description: Model representing MCP settings for a flow.
      properties:
        action_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Action Description
        action_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Action Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        id:
          format: uuid
          title: Id
          type: string
        mcp_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Mcp Enabled
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      required:
      - id
      title: MCPSettings
      type: object
    MCPProjectUpdateRequest:
      description: Request model for updating MCP project settings including auth.
      properties:
        auth_settings:
          anyOf:
          - $ref: '#/components/schemas/AuthSettings'
          - type: 'null'
        settings:
          items:
            $ref: '#/components/schemas/MCPSettings'
          title: Settings
          type: array
      required:
      - settings
      title: MCPProjectUpdateRequest
      type: object
    AuthSettings:
      description: Model representing authentication settings for MCP.
      properties:
        auth_type:
          default: none
          enum:
          - none
          - apikey
          - oauth
          title: Auth Type
          type: string
        oauth_auth_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Oauth Auth Url
        oauth_callback_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Oauth Callback Path
        oauth_callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Oauth Callback Url
        oauth_client_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Oauth Client Id
        oauth_client_secret:
          anyOf:
          - format: password
            type: string
            writeOnly: true
          - type: 'null'
          title: Oauth Client Secret
        oauth_host:
          anyOf:
          - type: string
          - type: 'null'
          title: Oauth Host
        oauth_mcp_scope:
          anyOf:
          - type: string
          - type: 'null'
          title: Oauth Mcp Scope
        oauth_port:
          anyOf:
          - type: string
          - type: 'null'
          title: Oauth Port
        oauth_provider_scope:
          anyOf:
          - type: string
          - type: 'null'
          title: Oauth Provider Scope
        oauth_server_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Oauth Server Url
        oauth_token_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Oauth Token Url
      title: AuthSettings
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    MCPInstallRequest:
      properties:
        client:
          title: Client
          type: string
        transport:
          anyOf:
          - enum:
            - sse
            - streamablehttp
            type: string
          - type: 'null'
          title: Transport
      required:
      - client
      title: MCPInstallRequest
      type: object
    ComposerUrlResponse:
      description: Response model for MCP Composer connection details.
      properties:
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        legacy_sse_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Legacy Sse Url
        project_id:
          title: Project Id
          type: string
        streamable_http_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Streamable Http Url
        uses_composer:
          title: Uses Composer
          type: boolean
      required:
      - project_id
      - uses_composer
      title: ComposerUrlResponse
      type: object
  securitySchemes:
    API key header:
      in: header
      name: x-api-key
      type: apiKey
    API key query:
      in: query
      name: x-api-key
      type: apiKey
    OAuth2PasswordBearerCookie:
      flows:
        password:
          scopes: {}
          tokenUrl: api/v1/login
      type: oauth2
